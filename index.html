    // 6-XONALI SKU (ID) GENERATOR
    function generateProductSKU(catId) {
      if (!catId) return "100001";

      let path = [];
      let current = categories.find(c => c.id === catId);
      while (current) {
        path.unshift(current);
        current = categories.find(c => c.id === current.parentId);
      }

      let l1 = 1, l2 = 0, l3 = 0;

      if (path.length >= 1) {
        const rootCats = categories.filter(c => !c.parentId);
        const idx = rootCats.findIndex(c => c.id === path[0].id);
        l1 = idx >= 0 ? ((idx + 1) % 10) : 1;
      }

      if (path.length >= 2) {
        const subCats = categories.filter(c => c.parentId === path[0].id);
        const idx = subCats.findIndex(c => c.id === path[1].id);
        l2 = idx >= 0 ? ((idx + 1) % 10) : 0;
      }

      if (path.length >= 3) {
        const subSubCats = categories.filter(c => c.parentId === path[1].id);
        const idx = subSubCats.findIndex(c => c.id === path[2].id);
        l3 = idx >= 0 ? ((idx + 1) % 10) : 0;
      }

      const prefix = `${l1}${l2}${l3}`;
      const prodsInCat = products.filter(p => p.categoryId === catId);
      const prodNum = (prodsInCat.length + 1).toString().padStart(3, '0');

      return `${prefix}${prodNum}`;
    }

    // TRANSLITERATION & SEARCH
    function normalizeText(text) {
      if (!text) return { latin: '', cyrillic: '' };
      let str = text.toLowerCase().trim();
      const map = { 'sh':'ш','ch':'ч','yo':'ё','yu':'ю','ya':'я','ye':'е','a':'а','b':'б','v':'в','g':'г','d':'д','e':'е','z':'з','i':'и','j':'ж','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','u':'у','f':'ф','x':'х','h':'ҳ' };
      let cyr = str;
      for (let k in map) cyr = cyr.split(k).join(map[k]);
      return { latin: str, cyrillic: cyr };
    }

    // Mahsulotlarni nomi (lotin/kirill) YOKI ID (SKU) bo'yicha qidirish.
    // ID bo'yicha to'g'ridan-to'g'ri mos kelganlar ro'yxat boshida chiqadi.
    function searchProducts(query) {
      const activeProducts = products.filter(p => p.status !== 'DELETED').sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
      if (!query || !query.trim()) return activeProducts;

      const { latin, cyrillic } = normalizeText(query);
      const results = activeProducts.filter(p => {
        const pNorm = normalizeText(p.name);
        const skuMatch = String(p.sku || '').toLowerCase().includes(latin);
        return pNorm.latin.includes(latin) || pNorm.cyrillic.includes(cyrillic) || skuMatch;
      });

      results.sort((a, b) => {
        const aSkuStarts = String(a.sku || '').toLowerCase().startsWith(latin) ? 0 : 1;
        const bSkuStarts = String(b.sku || '').toLowerCase().startsWith(latin) ? 0 : 1;
        return aSkuStarts - bSkuStarts;
      });

      return results;
    }

    // CART LOGIC
    function addToCart(id, e) {
      if (e) e.stopPropagation();
      const p = products.find(prod => prod.id === id);
      if (!p || p.stock <= 0) return alert("Mahsulot tugagan!");

      if (!cart[id]) {
        cart[id] = { qty: 1, addedAt: new Date().toLocaleString() };
        const logUser = `${currentUser.firstName} ${currentUser.lastName}`.trim();
        cartLogs.unshift({ user: logUser, productName: p.name, time: new Date().toLocaleString() });
        // Adminlar ko'ra olishi uchun Supabase'ga ham yozamiz (fon rejimida)
        sb.from('cart_logs').insert({ tg_id: currentTgId, user_name: logUser, product_name: p.name }).then();
      } else {
        if (p.stock && cart[id].qty >= p.stock) {
          return alert(`⚠️ Omborda faqat ${p.stock} ta mavjud!`);
        }
        cart[id].qty += 1;
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      render();
    }

    function changeCartQty(id, delta, e) {
      if (e) e.stopPropagation();
      if (!cart[id]) return;
      const p = products.find(prod => prod.id === id);
      const newQty = cart[id].qty + delta;

      if (newQty <= 0) {
        delete cart[id];
      } else if (p && p.stock && newQty > p.stock) {
        alert(`⚠️ Omborda faqat ${p.stock} ta mavjud!`);
        return; // qty o'zgarmaydi
      } else {
        cart[id].qty = newQty;
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      render();
    }

    function updateCartBadge() {
      const count = Object.values(cart).reduce((a, b) => a + (b.qty || 0), 0);
      const badge = document.getElementById('cart-badge');
      if (count > 0) {
        badge.innerText = count;
        badge.classList.remove('hidden');
        badge.classList.add('flex');
      } else {
        badge.classList.add('hidden');
      }
    }

    // ============ IMAGE UPLOAD (Supabase Storage) ============
    // Fayl tanlanganda: faqat preview uchun base64 o'qiladi, haqiqiy fayl saqlab qo'yiladi.
    function onImagePicked(event, previewId) {
      const file = event.target.files[0];
      if (!file) return;
      tempImageFile = file;
      const reader = new FileReader();
      reader.onload = function (e) {
        tempImagePreviewUrl = e.target.result;
        const prev = document.getElementById(previewId);
        if (prev) {
          prev.src = tempImagePreviewUrl;
          prev.classList.remove('hidden');
        }
      };
      reader.readAsDataURL(file);
    }

    // Saqlash bosilganda chaqiriladi: agar yangi fayl tanlangan bo'lsa, uni Storage'ga yuklab,
    // ochiq (public) URL manzilini qaytaradi. Yangi fayl bo'lmasa, eski URL qoladi.
    async function uploadImageIfNeeded(existingUrl) {
      if (!tempImageFile) return existingUrl || null;

      showLoader("Rasm yuklanmoqda...");
      try {
        const ext = (tempImageFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
        const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

        const { error: upErr } = await sb.storage.from(CONFIG.IMAGES_BUCKET).upload(path, tempImageFile, {
          cacheControl: '3600',
          upsert: false
        });
        if (upErr) throw upErr;

        const { data: pub } = sb.storage.from(CONFIG.IMAGES_BUCKET).getPublicUrl(path);
        return pub?.publicUrl || existingUrl || null;
      } catch (e) {
        console.error('Rasm yuklash xatosi:', e);
        alert("⚠️ Rasmni yuklashda xatolik yuz berdi. Avvalgi/standart rasm qoldiriladi.");
        return existingUrl || null;
      } finally {
        hideLoader();
      }
    }

    function handleSearch() {

          <div>

              ${p.isFeatured ? `<span class="absolute top-1 left-1 bg-amber-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-md">Bosh sahifa</span>` : ''}

    let selectedPayMethod = 'CASH';

   function handleRegionChange() {

      const viloyatWrap = document.getElementById('chk-viloyat-wrap');

      const cardBtn = document.getElementById('pay-card-btn');

      } else {
        btsWarn.classList.add('hidden');
        viloyatWrap.classList.add('hidden');

        districtSelect.innerHTML = '<option value="">— Tanlang —</option>' +
          TASHKENT_CITY_DISTRICTS.map(d => `<option value="${d}">${d}</option>`).join('');

        // Toshkent shahrida ikkalasi ko'rinadi, karta o'chiq
        payWrap.className = "grid grid-cols-2 gap-2 mt-1";
        cashBtn.classList.remove('hidden');
        selectedPayMethod = 'CASH';
        cashBtn.className = "py-2.5 border-2 border-blue-600 bg-blue-50 text-blue-700 font-bold rounded-xl text-xs";
        cardBtn.className = "py-2.5 border rounded-xl font-bold text-xs text-gray-400 bg-gray-50";

    function handleViloyatChange() {
      const viloyat = document.getElementById('chk-viloyat').value;
      const districtSelect = document.getElementById('chk-district');
      const tumanlar = UZ_REGIONS[viloyat] || [];
      districtSelect.innerHTML = '<option value="">— Tanlang —</option>' +
        tumanlar.map(d => `<option value="${d}">${d}</option>`).join('');
    }

    function selectPayment(type) {
      if (type === 'CARD') {
        alert("ℹ️ Karta orqali to'lov hozircha ishlab chiqilmoqda. Tez orada faollashtiriladi.");
        return;
      }
      selectedPayMethod = 'CASH';
      const cashBtn = document.getElementById('pay-cash-btn');
      const cardBtn = document.getElementById('pay-card-btn');
      if (cashBtn) cashBtn.className = "py-2.5 border-2 border-blue-600 bg-blue-50 text-blue-700 font-bold rounded-xl text-xs";
      if (cardBtn) cardBtn.className = "py-2.5 border rounded-xl font-bold text-xs text-gray-400 bg-gray-50";
    }

    let submittingOrder = false;
    async function submitOrder() {
      const fullname = document.getElementById('chk-fullname').value.trim();
      const phone = document.getElementById('chk-phone').value.trim();
      const region = document.getElementById('chk-region').value;
      const viloyat = region === 'PROVINCE' ? document.getElementById('chk-viloyat').value : '';
      const tuman = document.getElementById('chk-district').value.trim();
      const district = region === 'PROVINCE' ? `${viloyat}, ${tuman}` : tuman;
      const address = document.getElementById('chk-address').value.trim();

      let hasError = false;

      const requiredFields = [['chk-fullname', fullname], ['chk-phone', phone], ['chk-district', tuman], ['chk-address', address]];
      if (region === 'PROVINCE') requiredFields.push(['chk-viloyat', viloyat]);

      requiredFields.forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (!val || val === '+998') {
          el.classList.add('border-red-500', 'bg-red-50');
          hasError = true;
        } else {
          el.classList.remove('border-red-500', 'bg-red-50');
        }
      });

      if (hasError) return alert("Iltimos, barcha qizil maydonlarni to'ldiring!");

      if (region === 'PROVINCE') {
        return alert("❌ Hozircha viloyatlarga faqat karta orqali to'lov mumkin, u esa hali ishlamayapti. Tez orada faollashtiriladi.");
      }
      if (selectedPayMethod !== 'CASH') {
        return alert("❌ Hozircha faqat naqd pul bilan buyurtma qabul qilinadi.");
      }

      // Savatdagi tovarlar hali ham omborda yetarlimi — tekshiramiz
      for (const [id, itemData] of Object.entries(cart)) {
        const p = products.find(prod => prod.id === id);
        if (!p || p.stock < itemData.qty) {
          return alert(`❌ "${p ? p.name : 'Mahsulot'}" omborda yetarli emas. Iltimos, savatchani tekshiring.`);
        }
      }

      if (submittingOrder) return;
      submittingOrder = true;
      showLoader("Buyurtma qabul qilinmoqda...");

      const orderItems = Object.entries(cart).map(([id, itemData]) => {
        const p = products.find(prod => prod.id === id);
        return { name: p.name, qty: itemData.qty, price: p.price, sku: p.sku };
      });

      const totalPrice = orderItems.reduce((s, i) => s + (i.price * i.qty), 0);

      const dbRow = {
        tg_id: currentTgId,
        user_name: fullname,
        phone, region, district, address,
        pay_method: selectedPayMethod,
        items: orderItems,
        total_price: totalPrice,
        status: "NEW"
      };

      const { data, error } = await sb.from('orders').insert(dbRow).select().single();

      if (error) {
        submittingOrder = false;
        hideLoader();
        console.error(error);
        return alert("❌ Buyurtmani yuborishda xatolik yuz berdi. Qayta urinib ko'ring.");
      }

      const newOrder = mapOrderFromDB(data);
      orders.unshift(newOrder);

      // Ombordagi qoldiqni kamaytiramiz (fon rejimida, kutmasdan)
      orderItems.forEach(item => {
        const p = products.find(prod => prod.sku === item.sku);
        if (p) {
          p.stock = Math.max(0, p.stock - item.qty);
          p.status = p.stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK';
          sb.from('products').update({ stock: p.stock, status: p.status }).eq('id', p.id).then();
        }
      });

      submittingOrder = false;
      hideLoader();

      // TELEGRAM XABARNOMASI — natijani KUTMAYMIZ (fon rejimida jo'natiladi),
      // aks holda Telegram API sekinlashganda mijoz bir necha daqiqa "muzlab" turadi.
      let msg = `🛍 <b>FITCORE - YANGI BUYURTMA #${newOrder.id}</b>\n\n`;
      msg += `👤 <b>Mijoz:</b> ${fullname}\n📞 <b>Tel:</b> ${phone}\n📍 <b>Hudud:</b> ${region} (${district})\n🏠 <b>Manzil:</b> ${address}\n💳 <b>To'lov:</b> ${selectedPayMethod}\n\n📦 <b>Tarkib:</b>\n`;
      orderItems.forEach(i => msg += `• ${i.name} (ID: ${i.sku}) x${i.qty} = ${(i.price * i.qty).toLocaleString()} so'm\n`);
      msg += `\n💰 <b>Jami:</b> ${totalPrice.toLocaleString()} so'm`;

      const notifyIds = Array.from(new Set([String(CONFIG.ADMIN_ID), ...adminsList.map(String)]));
      notifyIds.forEach(chatId => {
        fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'HTML' })
        }).catch(e => console.error('Telegram xabarnoma xatosi:', e));
      });

      cart = {};
      localStorage.setItem('cart', JSON.stringify(cart));
      openOrderSuccessCelebration(newOrder.id);
    }

    function openOrderSuccessCelebration(orderId) {
      selectedProductModal = null;
      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl p-6 text-center max-w-sm w-full space-y-4 shadow-2xl">

            <h3 class="text-xl font-black text-gray-900">Buyurtmangiz Qabul Qilindi!</h3>
            <p class="text-xs text-gray-500">Buyurtma ID: <b class="text-blue-600">#${orderId}</b>. FITCORE mutaxassislari tez orada siz bilan bog'lanishadi.</p>
            <button onclick="document.getElementById('modal-container').innerHTML=''; switchTab('orders');" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl text-xs">
              📦 Buyurtmalarda ko'rish
            </button>
          </div>

    async function cancelUserOrder(orderId, e) {
      if (e) e.stopPropagation();
      if (!confirm("Rostdan ham ushbu buyurtmani bekor qilmoqchimisiz?")) return;
      const o = orders.find(ord => ord.id === orderId);
      if (!o) return;
      const { error } = await sb.from('orders').update({ status: 'CANCELLED' }).eq('id', orderId);
      if (error) return alert("❌ Xatolik yuz berdi, qayta urinib ko'ring.");

      // Bekor qilingan buyurtma tovarlarini omborga qaytaramiz
      o.items.forEach(item => {
        const p = products.find(prod => prod.sku === item.sku);
        if (p) {
          p.stock = p.stock + item.qty;
          p.status = 'ACTIVE';
          sb.from('products').update({ stock: p.stock, status: p.status }).eq('id', p.id).then();
        }
      });

      o.status = 'CANCELLED';
      alert("✅ Buyurtmangiz bekor qilindi!");
      render();
    }

    function toggleAdminStatusFilter(st) {
      if (adminOrderFilters.statuses.includes(st)) {
        adminOrderFilters.statuses = adminOrderFilters.statuses.filter(s => s !== st);
      } else {
        adminOrderFilters.statuses.push(st);

      render();
    }

                <label class="font-bold text-gray-600">Yangi Izoh / Tavsif:</label>
                <textarea id="ef-val" rows="3" class="w-full p-2 border rounded-xl">${escapeHtml(p.desc || '')}</textarea>
              ` : ''}

              ${field === 'img' ? `
                <label class="font-bold text-gray-600">Yangi Rasm (Xotiradan yuklash):</label>
                <input type="file" accept="image/*" onchange="onImagePicked(event, 'ef-img-prev')" class="w-full mt-1 text-xs">
                <img id="ef-img-prev" src="${escapeHtml(p.img || '')}" class="w-24 h-24 object-cover rounded-xl mt-2 border">
              ` : ''}

              <div class="flex space-x-2 pt-2">
                <button onclick="saveFieldEdit('${p.id}', '${field}')" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl">Saqlash</button>
                <button onclick="activePopupModal=null; render();" class="bg-gray-100 text-gray-700 font-bold px-4 py-2.5 rounded-xl">Bekor qilish</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // PRODUCT DETAILS MODAL
      if (selectedProductModal) {
        const p = selectedProductModal;
        const inCart = cart[p.id];
        const hasDiscount = p.oldPrice && p.oldPrice > p.price;

        container.innerHTML = `
          <div class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white rounded-t-3xl sm:rounded-3xl p-5 max-w-md w-full max-h-[90vh] overflow-y-auto space-y-4 shadow-2xl">
              <div class="flex justify-between items-center">
                <button onclick="selectedProductModal=null; render();" class="text-xs font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-xl">⬅️ Orqaga</button>
                <button onclick="selectedProductModal=null; switchTab('home');" class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl">🏠 Bosh sahifa</button>
              </div>

              <div class="relative">
                <img src="${escapeHtml(p.img || 'https://via.placeholder.com/300')}" class="w-full h-48 object-cover rounded-2xl border">
                ${(isAdminMode && isUserAnAdmin) ? `
                  <button onclick="openEditFieldModal('${p.id}', 'img')" class="absolute bottom-2 right-2 bg-blue-600 text-white font-bold text-[10px] px-2.5 py-1.5 rounded-xl flex items-center space-x-1 shadow">
                    <span>✏️ Rasmni O'zgartirish</span>
                  </button>
                ` : ''}
              </div>
              
              <div class="space-y-1">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded">ID: ${escapeHtml(p.sku)}</span>
                  ${(isAdminMode && isUserAnAdmin) ? `<button onclick="deleteProduct('${p.id}'); selectedProductModal=null; render();" class="text-xs bg-red-50 text-red-600 font-bold px-2 py-1 rounded-lg">🗑️ O'chirish</button>` : ''}
                </div>

                <!-- NAME WITH EDIT -->
                <div class="flex justify-between items-center pt-1">
                  <h2 class="text-lg font-black text-gray-900">${escapeHtml(p.name)}</h2>
                  ${(isAdminMode && isUserAnAdmin) ? `<button onclick="openEditFieldModal('${p.id}', 'name')" class="text-xs p-1 bg-blue-50 text-blue-600 rounded-lg font-bold">✏️</button>` : ''}
                </div>
                
                <!-- PRICE WITH EDIT -->
                <div class="flex justify-between items-center pt-1">
                  <div>
                    ${hasDiscount ? `
                      <div class="flex items-center space-x-2">
                        <span class="text-xs text-gray-400 line-through font-bold">${Number(p.oldPrice).toLocaleString()} so'm</span>
                        <span class="text-base text-red-600 font-black">${Number(p.price).toLocaleString()} so'm</span>
                      </div>
                    ` : `
                      <p class="text-base font-black text-blue-600">${Number(p.price).toLocaleString()} so'm</p>
                    `}
                  </div>
                  ${(isAdminMode && isUserAnAdmin) ? `<button onclick="openEditFieldModal('${p.id}', 'price')" class="text-xs p-1 bg-blue-50 text-blue-600 rounded-lg font-bold">✏️</button>` : ''}
                </div>

                <!-- STOCK WITH EDIT -->
                ${(isAdminMode && isUserAnAdmin) ? `
                  <div class="flex justify-between items-center pt-1 text-xs">
                    <span class="font-bold text-gray-600">Ombor Qoldig'i: <b class="${p.stock > 0 ? 'text-green-600' : 'text-red-500'}">${p.stock} ta</b></span>
                    <button onclick="openEditFieldModal('${p.id}', 'stock')" class="text-xs p-1 bg-blue-50 text-blue-600 rounded-lg font-bold">✏️</button>
                  </div>
                ` : ''}
              </div>

              <!-- TAVSIF WITH EDIT -->
              <div class="bg-gray-50 p-3 rounded-2xl border text-xs space-y-1 relative">
                <div class="flex justify-between items-center">
                  <h4 class="font-bold text-gray-700">📝 Tavsif / Izoh:</h4>
                  ${(isAdminMode && isUserAnAdmin) ? `<button onclick="openEditFieldModal('${p.id}', 'desc')" class="text-xs p-1 bg-blue-50 text-blue-600 rounded-lg font-bold">✏️</button>` : ''}
                </div>
                <p class="text-gray-600 leading-relaxed">${escapeHtml(p.desc || 'Tavsif kiritilmagan.')}</p>
              </div>

              ${!isAdminMode ? `
                <div>
                  ${p.stock > 0 ? (
                    inCart ? `
                      <div class="flex items-center justify-between bg-blue-50 border border-blue-200 rounded-2xl p-2">
                        <button onclick="changeCartQty('${p.id}', -1, event); openProductDetailModal('${p.id}');" class="w-10 h-10 bg-white font-bold rounded-xl shadow text-base text-blue-600">-</button>
                        <span class="font-bold text-base text-blue-800">${inCart.qty} ta savatda</span>
                        <button onclick="changeCartQty('${p.id}', 1, event); openProductDetailModal('${p.id}');" class="w-10 h-10 bg-blue-600 font-bold rounded-xl text-base text-white">+</button>
                      </div>
                    ` : `
                      <button onclick="addToCart('${p.id}', event); openProductDetailModal('${p.id}');" class="w-full bg-blue-600 text-white font-bold py-3 rounded-2xl text-sm">🛒 Savatga qo'shish</button>
                    `
                  ) : `<button disabled class="w-full bg-gray-100 text-gray-400 font-bold py-3 rounded-2xl text-sm">❌ Mahsulot tugagan</button>`}
                </div>
              ` : ''}
            </div>
          </div>
        `;
        return;
      }

      // ORDER DETAILS MODAL
      if (selectedOrderModal) {
        const o = selectedOrderModal;
        container.innerHTML = `
          <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-5 max-w-md w-full space-y-3 shadow-2xl text-xs">
              <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-black text-sm text-blue-600">Buyurtma #${o.id}</h3>
                <button onclick="selectedOrderModal=null; render();" class="text-xs bg-gray-100 font-bold px-2.5 py-1 rounded-xl">⬅️ Orqaga</button>
              </div>

              <div class="space-y-1">
                <p>👤 <b>Mijoz:</b> ${escapeHtml(o.user)}</p>
                <p>📞 <b>Tel:</b> ${escapeHtml(o.phone)}</p>
                <p>📍 <b>Hudud:</b> ${escapeHtml(o.region)} (${escapeHtml(o.district)})</p>
                <p>🏠 <b>Manzil:</b> ${escapeHtml(o.address)}</p>
                <p>💳 <b>To'lov:</b> ${escapeHtml(o.payMethod)}</p>
                <p>📅 <b>Sana:</b> ${escapeHtml(o.date)}</p>
              </div>

              <div class="border-t pt-2 space-y-1">
                <b>📦 Tovar:</b>
                ${o.items.map(i => `<p>• ${escapeHtml(i.name)} ${i.sku ? `<span class="text-gray-400 font-mono">(ID: ${escapeHtml(i.sku)})</span>` : ''} x ${i.qty} = ${(i.price * i.qty).toLocaleString()} so'm</p>`).join('')}
              </div>

              <div class="border-t pt-2 flex justify-between font-bold text-sm">
                <span>Jami:</span>
                <span class="text-green-600">${o.totalPrice.toLocaleString()} so'm</span>
              </div>

              ${(isAdminMode && isUserAnAdmin) ? `
                <div class="border-t pt-2 space-y-2">
                  <label class="font-bold text-gray-700">Tezkor Status O'zgartirish:</label>
                  <div class="grid grid-cols-2 gap-2">
                    <button onclick="updateOrderStatus(${o.id}, 'DELIVERED')" class="bg-green-600 text-white font-bold py-2 rounded-xl text-[11px]">✅ Bajarildi</button>
                    <button onclick="updateOrderStatus(${o.id}, 'PROCESSING')" class="bg-amber-600 text-white font-bold py-2 rounded-xl text-[11px]">⏳ Jarayonda</button>
                    <button onclick="updateOrderStatus(${o.id}, 'CANCELLED')" class="bg-red-600 text-white font-bold py-2 rounded-xl text-[11px] col-span-2">❌ Bekor Qilish</button>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = '';
    }

    // MODAL OPENERS & HANDLERS
    function openProductDetailModal(id) {
      activePopupModal = null;
      selectedProductModal = products.find(p => p.id === id);
      renderModalContainer();
    }

    function openEditFieldModal(prodId, fieldName) {
      selectedProductModal = products.find(p => p.id === prodId);
      editingFieldData = fieldName;
      tempImageFile = null;
      tempImagePreviewUrl = (fieldName === 'img' && selectedProductModal) ? selectedProductModal.img : null;
      activePopupModal = 'EDIT_PROD_FIELD';
      render();
    }

    function openOrderModal(id) {
      selectedOrderModal = orders.find(o => o.id === id);
      renderModalContainer();
    }

    async function updateOrderStatus(id, newStatus) {
      const o = orders.find(ord => ord.id === id);
      const prevStatus = o ? o.status : null;

      const { error } = await sb.from('orders').update({ status: newStatus }).eq('id', id);
      if (error) return alert("❌ Statusni o'zgartirishda xatolik yuz berdi.");

      // Agar buyurtma bekor qilinsa (avval bekor qilinmagan bo'lsa) — tovarlarni omborga qaytaramiz
      if (o && newStatus === 'CANCELLED' && prevStatus !== 'CANCELLED') {
        o.items.forEach(item => {
          const p = products.find(prod => prod.sku === item.sku);
          if (p) {
            p.stock = p.stock + item.qty;
            p.status = 'ACTIVE';
            sb.from('products').update({ stock: p.stock, status: p.status }).eq('id', p.id).then();
          }
        });
      }

      if (o) o.status = newStatus;
      selectedOrderModal = null;
      render();
    }

    // MODAL SAVERS
    function saveRegistrationFromModal() {
      const fn = document.getElementById('reg-fname').value.trim();
      const ln = document.getElementById('reg-lname').value.trim();
      const ph = document.getElementById('reg-phone').value.trim();

      if (!fn || !ph || ph === '+998') return alert("Iltimos, ismingiz va telefon raqamingizni kiriting!");

      registeredUser = { firstName: fn, lastName: ln, phone: ph };
      localStorage.setItem('registeredUser', JSON.stringify(registeredUser));
      currentUser.firstName = fn;
      currentUser.lastName = ln;
      currentUser.phone = ph;

      activePopupModal = null;
      alert("✅ Ro'yxatdan o'tdingiz!");
      render();
    }

    async function saveProductFromModal() {
      const name = document.getElementById('m-prod-name').value.trim();
      const price = parseFloat(document.getElementById('m-prod-price').value);
      const oldPriceVal = parseFloat(document.getElementById('m-prod-oldprice').value);
      const stock = parseInt(document.getElementById('m-prod-stock').value, 10);
      const desc = document.getElementById('m-prod-desc').value.trim();

      if (!name || isNaN(price) || isNaN(stock)) return alert("Iltimos, barcha majburiy maydonlarni to'ldiring!");

      let oldPrice = null;
      if (!isNaN(oldPriceVal) && oldPriceVal > price) {
        oldPrice = oldPriceVal;
      }

      const sku = generateProductSKU(adminCatParentId);
      const imgUrl = await uploadImageIfNeeded(null);

      const dbRow = {
        sku, name, price, old_price: oldPrice, stock,
        description: desc || name,
        img: imgUrl || "https://via.placeholder.com/150",
        category_id: adminCatParentId,
        status: stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK',
        is_featured: true, sort_order: products.length + 1
      };

      showLoader("Tovar saqlanmoqda...");
      const { data, error } = await sb.from('products').insert(dbRow).select().single();
      hideLoader();
      if (error) { console.error(error); return alert("❌ Tovarni saqlashda xatolik yuz berdi."); }

      products.push(mapProductFromDB(data));
      tempImageFile = null;
      tempImagePreviewUrl = null;
      activePopupModal = null;
      alert(`✅ Yangi tovar (ID: ${sku}) muvaffaqiyatli qo'shildi!`);
      render();
    }

    async function saveCategoryFromModal() {
      const name = document.getElementById('m-cat-name').value.trim();
      if (!name) return alert("Katalog nomini kiriting!");

      const imgUrl = await uploadImageIfNeeded(null);

      const dbRow = {
        name,
        img: imgUrl || (adminCatParentId ? "📦" : "📁"),
        parent_id: adminCatParentId
      };

      showLoader("Katalog saqlanmoqda...");
      const { data, error } = await sb.from('categories').insert(dbRow).select().single();
      hideLoader();
      if (error) { console.error(error); return alert("❌ Katalogni saqlashda xatolik yuz berdi."); }

      categories.push(mapCategoryFromDB(data));
      tempImageFile = null;
      tempImagePreviewUrl = null;
      activePopupModal = null;
      alert("✅ Katalog yaratildi!");
      render();
    }

    async function saveAdminFromModal() {
      const idVal = document.getElementById('m-admin-id').value.trim();
      if (!idVal || isNaN(idVal)) return alert("To'g'ri Telegram ID kiriting!");

      if (!adminsList.includes(idVal)) {
        const { error } = await sb.from('admins').insert({ tg_id: idVal });
        if (error) { console.error(error); return alert("❌ Adminni qo'shishda xatolik yuz berdi."); }
        adminsList.push(idVal);
        alert("✅ Yangi admin biriktirildi!");
      }
      activePopupModal = null;
      render();
    }

    async function saveFieldEdit(prodId, field) {
      const p = products.find(prod => prod.id === prodId);
      if (!p) return;

      const dbUpdate = {};

      if (field === 'name') {
        const val = document.getElementById('ef-val').value.trim();
        if (val) { p.name = val; dbUpdate.name = val; }
      } else if (field === 'price') {
        const price = parseFloat(document.getElementById('ef-price').value);
        const oldVal = parseFloat(document.getElementById('ef-oldprice').value);
        if (!isNaN(price)) {
          p.price = price;
          p.oldPrice = (!isNaN(oldVal) && oldVal > price) ? oldVal : null;
          dbUpdate.price = p.price;
          dbUpdate.old_price = p.oldPrice;
        }
      } else if (field === 'stock') {
        const stock = parseInt(document.getElementById('ef-val').value, 10);
        if (!isNaN(stock)) {
          p.stock = stock;
          p.status = stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK';
          dbUpdate.stock = p.stock;
          dbUpdate.status = p.status;
        }
      } else if (field === 'desc') {
        p.desc = document.getElementById('ef-val').value.trim();
        dbUpdate.description = p.desc;
      } else if (field === 'img') {
        const newUrl = await uploadImageIfNeeded(p.img);
        if (newUrl) { p.img = newUrl; dbUpdate.img = p.img; }
      }

      if (Object.keys(dbUpdate).length > 0) {
        const { error } = await sb.from('products').update(dbUpdate).eq('id', prodId);
        if (error) { console.error(error); return alert("❌ Saqlashda xatolik yuz berdi."); }
      }

      tempImageFile = null;
      tempImagePreviewUrl = null;
      activePopupModal = null;
      selectedProductModal = p;
      render();
    }

    function openAddProductModal() {
      tempImageFile = null;
      tempImagePreviewUrl = null;
      activePopupModal = 'ADD_PROD';
      render();
    }

    function openAddCatModal() {
      tempImageFile = null;
      tempImagePreviewUrl = null;
      activePopupModal = 'ADD_CAT';
      render();
    }

    async function openGranularEditCategoryModal(id, e) {
      if (e) e.stopPropagation();
      const c = categories.find(cat => cat.id === id);
      if (!c) return;

      const name = prompt("Yangi katalog nomi:", c.name);
      if (!name) return;

      const { error } = await sb.from('categories').update({ name }).eq('id', id);
      if (error) { console.error(error); return alert("❌ Xatolik yuz berdi."); }
      c.name = name;
      render();
    }

    // ⬆️⬇️ tugmalari FAQAT joriy ko'rinib turgan ro'yxat (currentVisibleProductIds) ichida ishlaydi.
    // Bazaga faqat 2 ta qatnashuvchi mahsulot yoziladi (avvalgidek BARCHA mahsulotlar emas) — tezroq va to'g'ri ishlaydi.
    async function moveProductSort(id, dir) {
      const list = currentVisibleProductIds;
      const idx = list.indexOf(id);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= list.length) return;

      const prodA = products.find(p => p.id === list[idx]);
      const prodB = products.find(p => p.id === list[targetIdx]);
      if (!prodA || !prodB) return;

      const tmp = prodA.sortOrder;
      prodA.sortOrder = prodB.sortOrder;
      prodB.sortOrder = tmp;

      render();

      await Promise.all([
        sb.from('products').update({ sort_order: prodA.sortOrder }).eq('id', prodA.id),
        sb.from('products').update({ sort_order: prodB.sortOrder }).eq('id', prodB.id)
      ]);
    }

    async function toggleProductFeatured(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;
      const newVal = !p.isFeatured;
      const { error } = await sb.from('products').update({ is_featured: newVal }).eq('id', id);
      if (error) { console.error(error); return alert("❌ Xatolik yuz berdi."); }
      p.isFeatured = newVal;
      render();
    }

    async function deleteProduct(id) {
      if (!confirm("Rostdan ham ushbu mahsulotni o'chirmoqchimisiz?")) return;
      const { error } = await sb.from('products').update({ status: 'DELETED' }).eq('id', id);
      if (error) { console.error(error); return alert("❌ O'chirishda xatolik yuz berdi."); }
      products = products.filter(prod => prod.id !== id);
      render();
    }

    async function deleteCategory(id, e) {
      if (e) e.stopPropagation();
      if (!confirm("Katalog o'chirilsinmi?")) return;
      const { error } = await sb.from('categories').delete().eq('id', id);
      if (error) { console.error(error); return alert("❌ O'chirishda xatolik yuz berdi. Ehtimol bu katalogda pastki kataloglar/tovarlar bog'langan."); }
      categories = categories.filter(c => c.id !== id);
      render();
    }

    async function saveBulkStock() {
      const input = document.getElementById('bulk-input').value.trim();
      if (!input) return alert("Ma'lumot kiriting!");

      const lines = input.split('\n');
      const updates = [];

      lines.forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
          const sku = parts[0].toUpperCase();
          const stock = parseInt(parts[1], 10);

          const p = products.find(prod => prod.sku === sku);
          if (p && !isNaN(stock)) {
            p.stock = stock;
            p.status = stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK';
            updates.push(p);
          }
        }
      });

      await Promise.all(updates.map(p => sb.from('products').update({ stock: p.stock, status: p.status }).eq('id', p.id)));

      alert(`✅ ${updates.length} ta mahsulot qoldig'i yangilandi!`);
      render();
    }

    // ============ BOOT: SUPABASE'DAN MA'LUMOTLARNI YUKLASH ============
    // Tezlik uchun so'rovlar imkon qadar PARALLEL (Promise.all) yuboriladi, ketma-ket emas.
    async function loadInitialData() {
      try {
        // 1) Adminlar, tovarlar va kataloglarni BIR VAQTDA (parallel) yuklaymiz
        const [admRes, prodRes, catRes] = await Promise.all([
          sb.from('admins').select('tg_id'),
          sb.from('products').select('*').neq('status', 'DELETED').order('sort_order', { ascending: true }),
          sb.from('categories').select('*')
        ]);

        if (admRes.error) throw admRes.error;
        if (prodRes.error) throw prodRes.error;
        if (catRes.error) throw catRes.error;

        adminsList = (admRes.data || []).map(r => r.tg_id);
        products = (prodRes.data || []).map(mapProductFromDB);
        categories = (catRes.data || []).map(mapCategoryFromDB);

        // Bosh admin har doim adminlar ro'yxatida bo'lishi kerak
        if (isSuperAdmin && !adminsList.includes(currentTgId)) {
          await sb.from('admins').insert({ tg_id: currentTgId });
          adminsList.push(currentTgId);
        }

        isUserAnAdmin = isSuperAdmin || adminsList.includes(currentTgId);
        isAdminMode = isUserAnAdmin;

        // 2) Buyurtmalar va (admin bo'lsa) savatcha tarixini BIR VAQTDA yuklaymiz
        let ordQuery = sb.from('orders').select('*').order('id', { ascending: false });
        if (!isUserAnAdmin) ordQuery = ordQuery.eq('tg_id', currentTgId);

        const parallelJobs = [ordQuery];
        if (isUserAnAdmin) {
          parallelJobs.push(sb.from('cart_logs').select('*').order('id', { ascending: false }).limit(100));
        }

        const results = await Promise.all(parallelJobs);
        const ordRes = results[0];
        if (ordRes.error) throw ordRes.error;
        orders = (ordRes.data || []).map(mapOrderFromDB);

        if (isUserAnAdmin && results[1] && !results[1].error) {
          cartLogs = (results[1].data || []).map(mapCartLogFromDB);
        }

      } catch (err) {
        console.error('Supabase yuklash xatosi:', err);
        document.getElementById('app-content').innerHTML = `
          <div class="bg-red-50 border border-red-200 text-red-700 text-xs p-4 rounded-2xl">
            ⚠️ Ma'lumotlarni yuklashda xatolik yuz berdi. Internetni tekshiring yoki keyinroq urinib ko'ring.<br><br>
            <span class="font-mono text-[10px]">${escapeHtml((err && err.message) || String(err))}</span>
          </div>`;
        throw err;
      }
    }

    async function boot() {
      await loadInitialData();
      switchTab('home');
    }

    // INITIAL LAUNCH
    boot();
  </script>
</body>
</html>
