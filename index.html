<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Mini App - Onlayn Do'kon & Admin Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-20 font-sans">

  <!-- TOP HEADER -->
  <header class="bg-white sticky top-0 z-40 border-b px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 text-white font-black px-2.5 py-1 rounded-xl text-lg">PRO</div>
      <span class="font-bold text-lg text-gray-900">Sport Shop</span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="switchTab('cart')" class="relative p-2 bg-gray-100 rounded-full">
        <i data-lucide="shopping-cart" class="w-5 h-5 text-gray-700"></i>
        <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full items-center justify-center">0</span>
      </button>
      <button onclick="switchTab('profile')" class="p-2 bg-gray-100 rounded-full">
        <i data-lucide="user" class="w-5 h-5 text-gray-700"></i>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main id="app-content" class="p-4 max-w-md mx-auto">
    <!-- Kontent JavaScript orqali yuklanadi -->
  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t py-2 px-4 flex justify-around items-center z-40 shadow-lg">
    <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-xs mt-1">Bosh sahifa</span>
    </button>
    <button onclick="switchTab('categories')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-categories">
      <i data-lucide="folder" class="w-5 h-5"></i>
      <span class="text-xs mt-1">Kataloglar</span>
    </button>
    <button onclick="switchTab('cart')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-cart">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <span class="text-xs mt-1">Savatcha</span>
    </button>
    <button onclick="switchTab('orders')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-orders">
      <i data-lucide="package" class="w-5 h-5"></i>
      <span class="text-xs mt-1">Buyurtmalar</span>
    </button>
    <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-profile">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-xs mt-1">Profil</span>
    </button>
  </nav>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    // ⚙️ SOZLAMALAR
    const CONFIG = {
      BOT_TOKEN: "BOT_TOKEN_SHUYERGA", // BotFather bergan token
      ADMIN_ID: "ADMIN_ID_SHUYERGA"    // @userinfobot bergan ID raqamingiz
    };

    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // STORAGE INITIALIZATION
    function initStorage() {
      if (!localStorage.getItem('products')) {
        const initialProducts = [
          { id: "1", sku: "SP-00001", name: "Whey Protein Gold", price: 450000, stock: 15, categoryId: "cat-1-1", status: "ACTIVE", img: "https://images.unsplash.com/photo-1593095948071-474c5cc2989d?w=300", desc: "Zardob proteini 1kg" },
          { id: "2", sku: "SP-00002", name: "Creatine Monohydrate", price: 220000, stock: 0, categoryId: "cat-1-2", status: "OUT_OF_STOCK", img: "https://images.unsplash.com/photo-1584017911766-d451b3d0e843?w=300", desc: "Kreatin monogidrat 300g" },
          { id: "3", sku: "SP-00003", name: "Gantel 10kg", price: 320000, stock: 8, categoryId: "cat-2", status: "ACTIVE", img: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=300", desc: "Rezinalangan gantel" }
        ];
        localStorage.setItem('products', JSON.stringify(initialProducts));
      }

      if (!localStorage.getItem('categories')) {
        const initialCategories = [
          { id: "cat-1", name: "Sport oziq-ovqatlari", parentId: null, img: "🧪" },
          { id: "cat-1-1", name: "Protein", parentId: "cat-1", img: "🥛" },
          { id: "cat-1-2", name: "Kreatin", parentId: "cat-1", img: "⚡" },
          { id: "cat-2", name: "Sport buyumlari", parentId: null, img: "🏋️‍♂️" }
        ];
        localStorage.setItem('categories', JSON.stringify(initialCategories));
      }

      if (!localStorage.getItem('branches')) {
        const initialBranches = [
          { id: "b-1", name: "Samarqand Markaziy Filial", region: "Samarqand", address: "Registon ko'chasi 12" },
          { id: "b-2", name: "Farg'ona Filial", region: "Farg'ona", address: "Al-Farg'oniy ko'chasi 45" }
        ];
        localStorage.setItem('branches', JSON.stringify(initialBranches));
      }

      if (!localStorage.getItem('cart')) localStorage.setItem('cart', JSON.stringify({}));
      if (!localStorage.getItem('orders')) localStorage.setItem('orders', JSON.stringify([]));
    }

    initStorage();

    // STATE
    let products = JSON.parse(localStorage.getItem('products'));
    let categories = JSON.parse(localStorage.getItem('categories'));
    let branches = JSON.parse(localStorage.getItem('branches'));
    let cart = JSON.parse(localStorage.getItem('cart'));
    let orders = JSON.parse(localStorage.getItem('orders'));
    let currentTab = 'home';
    let isAdminView = false;
    let adminSubTab = 'catalog'; // 'catalog' | 'warehouse' | 'orders'
    let editingProduct = null;

    // LOTIN ↔ KIRILL TRANSLITERATION
    function normalizeText(text) {
      if (!text) return '';
      let str = text.toLowerCase().trim();
      const map = { 'sh':'ш','ch':'ч','yo':'ё','yu':'ю','ya':'я','ye':'е','a':'а','b':'б','v':'в','g':'г','d':'д','e':'е','z':'з','i':'и','j':'ж','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','u':'у','f':'ф','x':'х','h':'ҳ' };
      let cyr = str;
      for (let k in map) cyr = cyr.split(k).join(map[k]);
      return { latin: str, cyrillic: cyr };
    }

    function searchProducts(query) {
      if (!query) return products.filter(p => p.status !== 'DELETED');
      const { latin, cyrillic } = normalizeText(query);
      return products.filter(p => {
        if (p.status === 'DELETED') return false;
        const pNorm = normalizeText(p.name);
        return pNorm.latin.includes(latin) || pNorm.cyrillic.includes(cyrillic) || p.sku.toLowerCase().includes(latin);
      });
    }

    // NAVIGATION & TAB SWITCHING
    function switchTab(tab) {
      currentTab = tab;
      isAdminView = false;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('text-blue-600', 'font-bold'));
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) activeNav.classList.add('text-blue-600', 'font-bold');
      render();
    }

    function openAdminPanel() {
      isAdminView = true;
      renderAdminPanel();
    }

    // CART MANAGEMENT
    function addToCart(id) {
      const p = products.find(prod => prod.id === id);
      if (!p || p.stock <= 0) return alert("Mahsulot tugagan!");
      cart[id] = (cart[id] || 0) + 1;
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      render();
    }

    function changeCartQty(id, delta) {
      if (!cart[id]) return;
      cart[id] += delta;
      if (cart[id] <= 0) delete cart[id];
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      render();
    }

    function updateCartBadge() {
      const count = Object.values(cart).reduce((a, b) => a + b, 0);
      const badge = document.getElementById('cart-badge');
      if (count > 0) {
        badge.innerText = count;
        badge.classList.remove('hidden');
        badge.classList.add('flex');
      } else {
        badge.classList.add('hidden');
      }
    }

    // MAIN RENDER ENGINE
    function render() {
      updateCartBadge();
      const container = document.getElementById('app-content');
      
      if (isAdminView) {
        renderAdminPanel();
        return;
      }

      switch (currentTab) {
        case 'home': renderHome(container); break;
        case 'categories': renderCategories(container); break;
        case 'cart': renderCart(container); break;
        case 'orders': renderOrders(container); break;
        case 'profile': renderProfile(container); break;
      }
      lucide.createIcons();
    }

    // 1. HOME VIEW
    function renderHome(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="relative">
            <input type="text" id="search-input" oninput="handleSearch()" placeholder="Mahsulot qidirish (Lotin / Kirill)..." 
              class="w-full bg-white pl-10 pr-4 py-3 rounded-2xl border border-gray-200 text-sm shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-3.5"></i>
          </div>
          <div id="products-grid" class="grid grid-cols-2 gap-3"></div>
        </div>
      `;
      handleSearch();
    }

    function handleSearch() {
      const q = document.getElementById('search-input')?.value || '';
      const filtered = searchProducts(q);
      const grid = document.getElementById('products-grid');
      if (!grid) return;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-2 text-center py-8 bg-white rounded-2xl p-4">
            <p class="text-gray-500 font-medium">🔍 Mahsulot topilmadi</p>
            <button onclick="switchTab('categories')" class="mt-3 bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-xs font-bold">
              📂 Barcha kataloglarni ko'rish
            </button>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col justify-between">
          <div>
            <img src="${p.img || 'https://via.placeholder.com/150'}" class="w-full h-28 object-cover rounded-xl mb-2">
            <span class="text-[10px] bg-gray-100 font-mono text-gray-500 px-1.5 py-0.5 rounded">${p.sku}</span>
            <h4 class="font-bold text-sm text-gray-800 mt-1 leading-tight line-clamp-1">${p.name}</h4>
            <p class="text-xs text-blue-600 font-black mt-1">${p.price.toLocaleString()} so'm</p>
          </div>
          <div class="mt-3">
            ${p.stock > 0 
              ? `<button onclick="addToCart('${p.id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center space-x-1">
                   <i data-lucide="plus" class="w-3.5 h-3.5"></i> <span>Savatga</span>
                 </button>`
              : `<button disabled class="w-full bg-gray-100 text-gray-400 font-bold py-2 rounded-xl text-xs">❌ Tugagan</button>`
            }
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // 2. CATEGORIES VIEW
    function renderCategories(container) {
      const topCategories = categories.filter(c => !c.parentId);

      container.innerHTML = `
        <div class="space-y-4">
          <h2 class="text-lg font-bold">📂 Kataloglar</h2>
          <div class="space-y-3">
            ${topCategories.map(parent => {
              const subCats = categories.filter(c => c.parentId === parent.id);
              return `
                <div class="bg-white rounded-2xl border p-4 space-y-2 shadow-sm">
                  <div class="flex items-center space-x-3 font-bold text-gray-900 border-b pb-2">
                    <span class="text-2xl">${parent.img || '📁'}</span>
                    <span>${parent.name}</span>
                  </div>
                  ${subCats.length > 0 ? `
                    <div class="pl-4 space-y-1">
                      ${subCats.map(sub => `
                        <div class="text-xs font-semibold text-blue-600 py-1 flex items-center justify-between">
                          <span>↳ ${sub.name}</span>
                          <span class="text-gray-400 text-[10px]">(${products.filter(p => p.categoryId === sub.id && p.status !== 'DELETED').length} ta)</span>
                        </div>
                      `).join('')}
                    </div>
                  ` : '<p class="text-[10px] text-gray-400 italic">Ichki katalog yo\'q</p>'}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // 3. CART & CHECKOUT
    function renderCart(container) {
      const items = Object.entries(cart).map(([id, qty]) => {
        const p = products.find(prod => prod.id === id);
        return p ? { ...p, qty } : null;
      }).filter(Boolean);

      let total = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl p-6">
            <i data-lucide="shopping-bag" class="w-12 h-12 text-gray-300 mx-auto mb-3"></i>
            <h3 class="font-bold text-gray-700">Savatchangiz bo'sh</h3>
            <button onclick="switchTab('home')" class="mt-4 bg-blue-600 text-white text-xs font-bold px-5 py-2.5 rounded-xl">
              Xarid qilish
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="space-y-4">
          <h2 class="text-lg font-bold">🛒 Savatcha</h2>
          <div class="bg-white rounded-2xl p-4 shadow-sm divide-y">
            ${items.map(item => `
              <div class="py-3 flex items-center justify-between">
                <div>
                  <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                  <p class="text-xs text-gray-500">${item.price.toLocaleString()} so'm</p>
                </div>
                <div class="flex items-center space-x-2">
                  <button onclick="changeCartQty('${item.id}', -1)" class="w-7 h-7 bg-gray-100 rounded-lg font-bold text-sm">-</button>
                  <span class="font-bold text-sm px-1">${item.qty}</span>
                  <button onclick="changeCartQty('${item.id}', 1)" class="w-7 h-7 bg-blue-600 text-white rounded-lg font-bold text-sm">+</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm space-y-3">
            <h3 class="font-bold text-sm border-b pb-2">📍 Yetkazib berish va To'lov</h3>
            
            <div>
              <label class="text-xs font-bold text-gray-600">Hudud:</label>
              <select id="region-type" onchange="toggleRegionFields()" class="w-full mt-1 p-2.5 border rounded-xl text-xs bg-gray-50 font-bold">
                <option value="TASHKENT">Toshkent shahri (Bepul)</option>
                <option value="PROVINCE">Viloyatlar (BeTez Pochta)</option>
              </select>
            </div>

            <div id="tashkent-fields">
              <input type="text" id="address-input" placeholder="To'liq uy manzili" class="w-full p-2.5 border rounded-xl text-xs">
            </div>

            <div id="province-fields" class="hidden space-y-2">
              <label class="text-xs font-bold text-gray-600">BeTez Pochta Filiali:</label>
              <select id="branch-select" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50">
                ${branches.map(b => `<option value="${b.id}">${b.name} (${b.region})</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="text-xs font-bold text-gray-600">To'lov turi:</label>
              <select id="payment-method" class="w-full mt-1 p-2.5 border rounded-xl text-xs bg-gray-50 font-bold">
                <option value="CASH">Naqd pul</option>
                <option value="CARD">Karta orqali</option>
              </select>
            </div>

            <input type="text" id="phone-input" placeholder="+998 90 123 45 67" class="w-full p-2.5 border rounded-xl text-xs">

            <div class="border-t pt-3 flex justify-between items-center text-lg font-black">
              <span>Jami:</span>
              <span id="final-total" class="text-green-600">${total.toLocaleString()} so'm</span>
            </div>

            <button onclick="processOrder()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl text-sm shadow-md">
              ✅ Buyurtmani tasdiqlash
            </button>
          </div>
        </div>
      `;
      toggleRegionFields();
    }

    function toggleRegionFields() {
      const region = document.getElementById('region-type')?.value;
      const tashkentBox = document.getElementById('tashkent-fields');
      const provinceBox = document.getElementById('province-fields');
      const paySelect = document.getElementById('payment-method');

      if (region === 'PROVINCE') {
        tashkentBox?.classList.add('hidden');
        provinceBox?.classList.remove('hidden');
        if (paySelect) { paySelect.value = 'CARD'; paySelect.disabled = true; }
      } else {
        tashkentBox?.classList.remove('hidden');
        provinceBox?.classList.add('hidden');
        if (paySelect) paySelect.disabled = false;
      }
    }

    async function processOrder() {
      const region = document.getElementById('region-type').value;
      const phone = document.getElementById('phone-input').value;
      const payMethod = document.getElementById('payment-method').value;
      
      let address = "";
      let deliveryFee = 0;

      if (region === 'TASHKENT') {
        address = document.getElementById('address-input').value;
        if (!address) return alert("Iltimos, uy manzilingizni kiriting!");
      } else {
        const branchId = document.getElementById('branch-select').value;
        const branch = branches.find(b => b.id === branchId);
        address = `BeTez Pochta: ${branch.name}`;
        deliveryFee = 25000;
      }

      if (!phone) return alert("Iltimos, telefon raqamingizni kiriting!");

      const orderItems = Object.entries(cart).map(([id, qty]) => {
        const p = products.find(prod => prod.id === id);
        return { name: p.name, qty, price: p.price, sku: p.sku };
      });

      const itemsPrice = orderItems.reduce((s, i) => s + (i.price * i.qty), 0);
      const totalPrice = itemsPrice + deliveryFee;

      const newOrder = {
        id: Math.floor(1000 + Math.random() * 9000),
        user: tg?.initDataUnsafe?.user?.first_name || "Mijoz",
        phone, region, address, payMethod,
        items: orderItems, totalPrice,
        status: "NEW", date: new Date().toLocaleString()
      };

      orders.unshift(newOrder);
      localStorage.setItem('orders', JSON.stringify(orders));

      // TELEGRAM NOTIFICATION
      let msg = `🛍 <b>YANGI BUYURTMA #${newOrder.id}</b>\n\n`;
      msg += `👤 <b>Mijoz:</b> ${newOrder.user}\n📞 <b>Tel:</b> ${phone}\n📍 <b>Manzil:</b> ${address}\n💳 <b>To'lov:</b> ${payMethod}\n\n📦 <b>Tarkib:</b>\n`;
      orderItems.forEach(i => msg += `• ${i.name} (x${i.qty}) = ${(i.price * i.qty).toLocaleString()} so'm\n`);
      msg += `\n💰 <b>Jami:</b> ${totalPrice.toLocaleString()} so'm`;

      try {
        await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CONFIG.ADMIN_ID, text: msg, parse_mode: 'HTML' })
        });
      } catch (e) {}

      cart = {};
      localStorage.setItem('cart', JSON.stringify(cart));
      alert("✅ Buyurtmangiz qabul qilindi!");
      switchTab('orders');
    }

    // 4. ORDERS VIEW
    function renderOrders(container) {
      container.innerHTML = `
        <div class="space-y-3">
          <h2 class="text-lg font-bold">📦 Buyurtmalarim</h2>
          ${orders.length === 0 ? '<p class="text-xs text-gray-500 bg-white p-4 rounded-xl text-center">Xaridlar tarixi yo\'q</p>' : ''}
          ${orders.map(o => `
            <div class="bg-white rounded-2xl p-4 shadow-sm space-y-2 border">
              <div class="flex justify-between items-center border-b pb-2">
                <span class="font-black text-blue-600">#${o.id}</span>
                <span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">${o.status}</span>
              </div>
              <p class="text-xs text-gray-500">📅 ${o.date}</p>
              <div class="text-xs space-y-1">
                ${o.items.map(i => `<p class="font-medium">• ${i.name} x ${i.qty}</p>`).join('')}
              </div>
              <div class="border-t pt-2 flex justify-between font-bold text-sm">
                <span>Summa:</span>
                <span class="text-green-600">${o.totalPrice.toLocaleString()} so'm</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // 5. PROFILE & ADMIN BUTTON VIEW
    function renderProfile(container) {
      const user = tg?.initDataUnsafe?.user;
      const isAdmin = user?.id == CONFIG.ADMIN_ID || true;

      container.innerHTML = `
        <div class="space-y-4">
          <div class="bg-white p-5 rounded-2xl shadow-sm flex items-center space-x-4 border">
            <div class="bg-blue-100 p-3 rounded-full text-blue-600">
              <i data-lucide="user" class="w-8 h-8"></i>
            </div>
            <div>
              <h2 class="text-lg font-bold">${user?.first_name || 'Foydalanuvchi'}</h2>
              <p class="text-xs text-gray-500">ID: ${user?.id || 'Telegram ID'}</p>
            </div>
          </div>

          ${isAdmin ? `
            <button onclick="openAdminPanel()" class="w-full bg-gradient-to-r from-slate-800 to-slate-900 text-white p-4 rounded-2xl flex items-center justify-between font-bold shadow-lg">
              <div class="flex items-center space-x-3">
                <i data-lucide="shield-check" class="text-emerald-400 w-6 h-6"></i>
                <span>Admin Panelga o'tish</span>
              </div>
              <span class="text-[10px] bg-slate-700 px-2 py-1 rounded">Boshqaruv</span>
            </button>
          ` : ''}
        </div>
      `;
    }

    // 🛠️ ADMIN PANEL ENGINE (Katalog, Mahsulot qo'shish/tahrirlash/o'chirish)
    function renderAdminPanel() {
      const container = document.getElementById('app-content');
      
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center bg-slate-900 text-white p-4 rounded-2xl">
            <div>
              <h2 class="font-bold">🛡️ ADMIN PANEL</h2>
              <p class="text-[10px] text-slate-400">Do'kon Boshqaruvi</p>
            </div>
            <button onclick="switchTab('profile')" class="bg-slate-700 text-xs px-3 py-1.5 rounded-xl font-bold">Chiqish</button>
          </div>

          <!-- ADMIN SUB NAV -->
          <div class="flex bg-white p-1 rounded-xl border text-xs font-bold">
            <button onclick="adminSubTab='catalog'; renderAdminPanel();" class="flex-1 py-2 rounded-lg ${adminSubTab==='catalog'?'bg-slate-900 text-white':''}">📂 Katalog & Tovar</button>
            <button onclick="adminSubTab='warehouse'; renderAdminPanel();" class="flex-1 py-2 rounded-lg ${adminSubTab==='warehouse'?'bg-slate-900 text-white':''}">🏭 Ombor (Bulk)</button>
          </div>

          ${adminSubTab === 'catalog' ? renderAdminCatalogSection() : renderAdminWarehouseSection()}
        </div>
      `;
      lucide.createIcons();
    }

    // ADMIN: KATALOG VA MAHSULOTLAR SECTION
    function renderAdminCatalogSection() {
      const topCats = categories.filter(c => !c.parentId);

      return `
        <div class="space-y-4">
          <!-- BOSH VA ICHKI KATALOG QO'SHISH -->
          <div class="bg-white p-4 rounded-2xl border space-y-3">
            <h3 class="font-bold text-sm text-gray-800">➕ Yangi Katalog Qo'shish</h3>
            <input type="text" id="new-cat-name" placeholder="Katalog nomi (Masalan: Proteinar)" class="w-full p-2.5 border rounded-xl text-xs">
            
            <select id="new-cat-parent" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50">
              <option value="">-- Bosh Katalog (Asosiy) --</option>
              ${topCats.map(c => `<option value="${c.id}">↳ ${c.name} ichiga (Ichki katalog)</option>`).join('')}
            </select>

            <button onclick="addCategory()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">
              📂 Katalog Yaratish
            </button>
          </div>

          <!-- MAHSULOT QO'SHISH / TAHRIRLASH MODAL/FORM -->
          <div class="bg-white p-4 rounded-2xl border space-y-3 shadow-sm">
            <h3 class="font-bold text-sm text-gray-800">${editingProduct ? '✏️ Mahsulotni Tahrirlash' : '➕ Yangi Mahsulot Qo\'shish'}</h3>
            
            <input type="text" id="prod-sku" placeholder="SKU ID (Masalan: SP-00005)" value="${editingProduct?.sku || ''}" class="w-full p-2.5 border rounded-xl text-xs font-mono">
            <input type="text" id="prod-name" placeholder="Mahsulot nomi" value="${editingProduct?.name || ''}" class="w-full p-2.5 border rounded-xl text-xs">
            <input type="number" id="prod-price" placeholder="Narxi (so'm)" value="${editingProduct?.price || ''}" class="w-full p-2.5 border rounded-xl text-xs">
            <input type="number" id="prod-stock" placeholder="Ombor qoldig'i (soni)" value="${editingProduct?.stock || ''}" class="w-full p-2.5 border rounded-xl text-xs">
            <input type="text" id="prod-img" placeholder="Rasm URL havolasi" value="${editingProduct?.img || ''}" class="w-full p-2.5 border rounded-xl text-xs">
            
            <div>
              <label class="text-[10px] text-gray-500 font-bold">Katalogini tanlang:</label>
              <select id="prod-cat" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50">
                ${categories.map(c => `<option value="${c.id}" ${editingProduct?.categoryId === c.id ? 'selected' : ''}>${c.parentId ? '  ↳ ' : ''}${c.name}</option>`).join('')}
              </select>
            </div>

            <div class="flex space-x-2 pt-2">
              <button onclick="saveProduct()" class="flex-1 bg-green-600 text-white font-bold py-2.5 rounded-xl text-xs">
                ${editingProduct ? '💾 Saqlash' : '➕ Qo\'shish'}
              </button>
              ${editingProduct ? `<button onclick="cancelEdit()" class="bg-gray-200 text-gray-700 font-bold px-4 rounded-xl text-xs">Bekor qilish</button>` : ''}
            </div>
          </div>

          <!-- KATALOGLAR VA ULARNING ICHIDAGI MAHSULOTLAR DARAXTI -->
          <div class="space-y-3">
            <h3 class="font-bold text-sm text-gray-800">📂 Mavjud Kataloglar va Tovarlar</h3>
            ${categories.map(cat => {
              const catProds = products.filter(p => p.categoryId === cat.id && p.status !== 'DELETED');
              return `
                <div class="bg-white p-3 rounded-2xl border space-y-2">
                  <div class="flex justify-between items-center border-b pb-2 font-bold text-xs text-gray-800">
                    <span>${cat.parentId ? '↳ ' : '📁 '} ${cat.name}</span>
                    <span class="text-gray-400 font-normal">(${catProds.length} ta tovar)</span>
                  </div>

                  <div class="space-y-2 pl-2">
                    ${catProds.length === 0 ? '<p class="text-[10px] text-gray-400 italic">Tovarlar yo\'q</p>' : ''}
                    ${catProds.map(p => `
                      <div class="flex items-center justify-between bg-gray-50 p-2 rounded-xl border text-xs">
                        <div>
                          <p class="font-bold text-gray-800">${p.name}</p>
                          <p class="text-[10px] text-gray-500">${p.price.toLocaleString()} so'm | Qoldiq: <b>${p.stock} ta</b></p>
                        </div>
                        <div class="flex items-center space-x-1">
                          <button onclick="editProduct('${p.id}')" class="p-1.5 bg-blue-100 text-blue-600 rounded-lg">
                            <i data-lucide="edit" class="w-3.5 h-3.5"></i>
                          </button>
                          <button onclick="deleteProduct('${p.id}')" class="p-1.5 bg-red-100 text-red-600 rounded-lg">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ADMIN: OMBOR SECTION
    function renderAdminWarehouseSection() {
      return `
        <div class="bg-white p-4 rounded-2xl border space-y-3">
          <h3 class="font-bold text-sm text-gray-800">🏭 Ombor Qoldiqlarini Yangilash (Bulk)</h3>
          <p class="text-[10px] text-gray-500">Har bir qatorga SKU va yangi sonini kiriting (Masalan: <b>SP-00001 35</b>)</p>
          <textarea id="bulk-input" rows="5" class="w-full p-2.5 font-mono text-xs border rounded-xl bg-gray-50" placeholder="SP-00001 35&#10;SP-00002 20"></textarea>
          <button onclick="saveBulkStock()" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs">💾 Barchasini saqlash</button>
        </div>
      `;
    }

    // ADMIN LOGIC FUNCTIONS
    function addCategory() {
      const name = document.getElementById('new-cat-name').value.trim();
      const parentId = document.getElementById('new-cat-parent').value || null;

      if (!name) return alert("Katalog nomini kiriting!");

      const newCat = {
        id: "cat-" + Date.now(),
        name, parentId, img: parentId ? "📦" : "📁"
      };

      categories.push(newCat);
      localStorage.setItem('categories', JSON.stringify(categories));
      alert("✅ Katalog yaratildi!");
      renderAdminPanel();
    }

    function saveProduct() {
      const sku = document.getElementById('prod-sku').value.trim() || ("SP-" + Math.floor(10000 + Math.random() * 90000));
      const name = document.getElementById('prod-name').value.trim();
      const price = parseFloat(document.getElementById('prod-price').value);
      const stock = parseInt(document.getElementById('prod-stock').value, 10);
      const img = document.getElementById('prod-img').value.trim() || "https://via.placeholder.com/150";
      const categoryId = document.getElementById('prod-cat').value;

      if (!name || isNaN(price) || isNaN(stock)) return alert("Barcha maydonlarni to'g'ri kiriting!");

      if (editingProduct) {
        // Tahrirlash
        const p = products.find(prod => prod.id === editingProduct.id);
        if (p) {
          p.sku = sku; p.name = name; p.price = price; p.stock = stock;
          p.img = img; p.categoryId = categoryId;
          p.status = stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK';
        }
        editingProduct = null;
        alert("✅ Mahsulot tahrirlandi!");
      } else {
        // Yangi qo'shish
        const newProd = {
          id: "prod-" + Date.now(),
          sku, name, price, stock, img, categoryId,
          status: stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK', desc: name
        };
        products.push(newProd);
        alert("✅ Yangi mahsulot qo'shildi!");
      }

      localStorage.setItem('products', JSON.stringify(products));
      renderAdminPanel();
    }

    function editProduct(id) {
      editingProduct = products.find(p => p.id === id);
      renderAdminPanel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingProduct = null;
      renderAdminPanel();
    }

    function deleteProduct(id) {
      if (!confirm("Rostdan ham ushbu mahsulotni o'chirmoqchimisiz?")) return;
      const p = products.find(prod => prod.id === id);
      if (p) p.status = 'DELETED';
      localStorage.setItem('products', JSON.stringify(products));
      renderAdminPanel();
    }

    function saveBulkStock() {
      const input = document.getElementById('bulk-input').value.trim();
      if (!input) return alert("Ma'lumot kiriting!");

      const lines = input.split('\n');
      let count = 0;

      lines.forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
          const sku = parts[0].toUpperCase();
          const stock = parseInt(parts[1], 10);
          
          const p = products.find(prod => prod.sku === sku);
          if (p && !isNaN(stock)) {
            p.stock = stock;
            p.status = stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK';
            count++;
          }
        }
      });

      localStorage.setItem('products', JSON.stringify(products));
      alert(`✅ ${count} ta mahsulot qoldig'i yangilandi!`);
      renderAdminPanel();
    }

    // INITIAL RENDER
    switchTab('home');
  </script>
</body>
</html>
