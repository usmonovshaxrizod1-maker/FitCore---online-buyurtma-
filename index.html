    // DIRECT REST API HELPER (ULTRA FAST & RELIABLE)
    async function apiRequest(endpoint, method = 'GET', body = null, query = '') {
      if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY) return null;
      const url = `${CONFIG.SUPABASE_URL}/rest/v1/${endpoint}${query}`;
      const headers = {
        'apikey': CONFIG.SUPABASE_KEY,
        'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      };

      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);

      const res = await fetch(url, options);
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText}`);
      }
      return await res.json();
    }

        isUserAnAdmin = isSuperAdmin || adminsList.includes(currentTgId);
        render();

      } catch (err) {
        console.warn("REST API sync skipped:", err);
      }

    // 6-XONALI SKU (ID) GENERATOR
    function generateProductSKU(catId) {
      if (!catId) return "100001";

      let path = [];
      let current = categories.find(c => c.id === catId);
      while (current) {
        path.unshift(current);
        current = categories.find(c => c.id === current.parentId);
      }

      let l1 = 1, l2 = 0, l3 = 0;

      if (path.length >= 1) {
        const rootCats = categories.filter(c => !c.parentId);
        const idx = rootCats.findIndex(c => c.id === path[0].id);
        l1 = idx >= 0 ? ((idx + 1) % 10) : 1;
      }

      if (path.length >= 2) {
        const subCats = categories.filter(c => c.parentId === path[0].id);
        const idx = subCats.findIndex(c => c.id === path[1].id);
        l2 = idx >= 0 ? ((idx + 1) % 10) : 0;
      }

      if (path.length >= 3) {
        const subSubCats = categories.filter(c => c.parentId === path[1].id);
        const idx = subSubCats.findIndex(c => c.id === path[2].id);
        l3 = idx >= 0 ? ((idx + 1) % 10) : 0;
      }

      const prefix = `${l1}${l2}${l3}`;
      const prodsInCat = products.filter(p => p.categoryId === catId);
      const prodNum = (prodsInCat.length + 1).toString().padStart(3, '0');

      return `${prefix}${prodNum}`;
    }

    // TRANSLITERATION & SEARCH
    function normalizeText(text) {
      if (!text) return '';
      let str = text.toLowerCase().trim();
      const map = { 'sh':'ш','ch':'ч','yo':'ё','yu':'ю','ya':'я','ye':'е','a':'а','b':'б','v':'в','g':'г','d':'д','e':'е','z':'з','i':'и','j':'ж','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','r':'р','s':'с','t':'т','u':'у','f':'ф','x':'х','h':'ҳ' };
      let cyr = str;
      for (let k in map) cyr = cyr.split(k).join(map[k]);
      return { latin: str, cyrillic: cyr };
    }

    function searchProducts(query) {
      const activeProducts = products.filter(p => p.status !== 'DELETED').sort((a,b) => (a.sortOrder || 0) - (b.sortOrder || 0));
      if (!query) return activeProducts;
      const { latin, cyrillic } = normalizeText(query);
      return activeProducts.filter(p => {
        const pNorm = normalizeText(p.name);
        return pNorm.latin.includes(latin) || pNorm.cyrillic.includes(cyrillic) || p.sku.toLowerCase().includes(latin);
      });
    }

    // CART LOGIC
    async function addToCart(id, e) {
      if (e) e.stopPropagation();
      const p = products.find(prod => prod.id === id);
      if (!p || p.stock <= 0) return alert("Mahsulot tugagan!");

      if (!cart[id]) {
        cart[id] = { qty: 1, addedAt: new Date().toLocaleString() };
        
        const userTitle = `${currentUser.firstName} ${currentUser.lastName}`.trim();
        cartLogs.unshift({ user: userTitle, productName: p.name, time: new Date().toLocaleString() });
        localStorage.setItem('cartLogs', JSON.stringify(cartLogs));

        try {
          await apiRequest('cart_logs', 'POST', [{ user_name: userTitle, product_name: p.name }]);
        } catch (err) {}
      } else {
        cart[id].qty += 1;
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      render();
    }

    function changeCartQty(id, delta, e) {
      if (e) e.stopPropagation();
      if (!cart[id]) return;
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      render();
    }

    function updateCartBadge() {
      const count = Object.values(cart).reduce((a, b) => a + (b.qty || 0), 0);
      const badge = document.getElementById('cart-badge');
      if (count > 0) {
        badge.innerText = count;
        badge.classList.remove('hidden');
        badge.classList.add('flex');
      } else {
        badge.classList.add('hidden');
      }
    }

    // CANVAS IMAGE COMPRESSOR (LIGHTWEIGHT BASE64)
    function onImagePicked(event, previewId) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 400;
          const MAX_HEIGHT = 400;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          tempBase64Image = canvas.toDataURL('image/jpeg', 0.7);

          const prev = document.getElementById(previewId);
          if (prev) {
            prev.src = tempBase64Image;
            prev.classList.remove('hidden');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    let selectedPayMethod = 'CASH';

    function handleRegionChange() {
      const region = document.getElementById('chk-region').value;
      const btsWarn = document.getElementById('bts-warning');
      const addrLabel = document.getElementById('chk-address-label');
      const addrInput = document.getElementById('chk-address');

      if (region === 'PROVINCE') {
        btsWarn.classList.remove('hidden');
        addrLabel.innerText = "BTS Pochta Manzili *";
        addrInput.placeholder = "Hududingizdagi BTS pochta manzilini kiriting";
        selectPayment('CARD');
      } else {
        btsWarn.classList.add('hidden');
        addrLabel.innerText = "Manzil *";
        addrInput.placeholder = "Ko'cha/qishloq/mahalla va uy raqami";
      }
    }

    function selectPayment(type) {
      const region = document.getElementById('chk-region')?.value;
      if (region === 'PROVINCE' && type === 'CASH') {
        alert("Viloyat buyurtmalarida faqat karta orqali to'lov mavjud!");
        return;
      }

      selectedPayMethod = type;
      const cashBtn = document.getElementById('pay-cash-btn');
      const cardBtn = document.getElementById('pay-card-btn');

      if (type === 'CARD') {
        alert("ℹ️ Karta orqali to'lov moduli ustida ishlanmoqda (Hozircha test rejimi)");
        cardBtn.className = "py-2.5 border-2 border-blue-600 bg-blue-50 text-blue-700 font-bold rounded-xl text-xs";
        cashBtn.className = "py-2.5 border rounded-xl font-bold text-xs text-gray-600";
      } else {
        cashBtn.className = "py-2.5 border-2 border-blue-600 bg-blue-50 text-blue-700 font-bold rounded-xl text-xs";
        cardBtn.className = "py-2.5 border rounded-xl font-bold text-xs text-gray-600";
      }
    }

    async function submitOrder() {
      const fullname = document.getElementById('chk-fullname').value.trim();
      const phone = document.getElementById('chk-phone').value.trim();
      const region = document.getElementById('chk-region').value;
      const district = document.getElementById('chk-district').value.trim();
      const address = document.getElementById('chk-address').value.trim();

      let hasError = false;

      [['chk-fullname', fullname], ['chk-phone', phone], ['chk-district', district], ['chk-address', address]].forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (!val || val === '+998') {
          el.classList.add('border-red-500', 'bg-red-50');
          hasError = true;
        } else {
          el.classList.remove('border-red-500', 'bg-red-50');
        }
      });

      if (hasError) return alert("Iltimos, barcha qizil maydonlarni to'ldiring!");

      const orderItems = Object.entries(cart).map(([id, itemData]) => {
        const p = products.find(prod => prod.id === id);
        return { name: p.name, qty: itemData.qty, price: p.price, sku: p.sku };
      });

      const totalPrice = orderItems.reduce((s, i) => s + (i.price * i.qty), 0);
      const newOrderId = Math.floor(1000 + Math.random() * 9000);

      const newOrder = {
        id: newOrderId,
        user: fullname,
        phone, region, district, address,
        payMethod: selectedPayMethod,
        items: orderItems,
        totalPrice,
        status: "NEW",
        date: new Date().toLocaleString()
      };

      try {
        await apiRequest('orders', 'POST', [{
          id: newOrderId, user_name: fullname, phone, region, district, address,
          payment_method: selectedPayMethod, items: orderItems, total_price: totalPrice, status: "NEW"
        }]);

        orders.unshift(newOrder);
        localStorage.setItem('orders', JSON.stringify(orders));

      } catch (e) {
        alert("❌ Buyurtmani saqlashda xatolik: " + e.message);
        return;
      }

      // TELEGRAM NOTIFICATION
      let msg = `🛍 <b>FITCORE - YANGI BUYURTMA #${newOrder.id}</b>\n\n`;
      msg += `👤 <b>Mijoz:</b> ${fullname}\n📞 <b>Tel:</b> ${phone}\n📍 <b>Hudud:</b> ${region} (${district})\n🏠 <b>Manzil:</b> ${address}\n💳 <b>To'lov:</b> ${selectedPayMethod}\n\n📦 <b>Tarkib:</b>\n`;
      orderItems.forEach(i => msg += `• ${i.name} (x${i.qty}) = ${(i.price * i.qty).toLocaleString()} so'm\n`);
      msg += `\n💰 <b>Jami:</b> ${totalPrice.toLocaleString()} so'm`;

      try {
        await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CONFIG.ADMIN_ID, text: msg, parse_mode: 'HTML' })
        });
      } catch (e) {}

      cart = {};
      localStorage.setItem('cart', JSON.stringify(cart));
      openOrderSuccessCelebration(newOrder.id);
    }

    // MODAL SAVERS WITH DIRECT REST API SYNC
    function saveRegistrationFromModal() {
      const fn = document.getElementById('reg-fname').value.trim();
      const ln = document.getElementById('reg-lname').value.trim();
      const ph = document.getElementById('reg-phone').value.trim();

      if (!fn || !ph || ph === '+998') return alert("Iltimos, ismingiz va telefon raqamingizni kiriting!");

      registeredUser = { firstName: fn, lastName: ln, phone: ph };
      localStorage.setItem('registeredUser', JSON.stringify(registeredUser));
      currentUser.firstName = fn;
      currentUser.lastName = ln;
      currentUser.phone = ph;

      activePopupModal = null;
      alert("✅ Ro'yxatdan o'tdingiz!");
      render();
    }

    async function saveProductFromModal() {
      const name = document.getElementById('m-prod-name').value.trim();
      const price = parseFloat(document.getElementById('m-prod-price').value);
      const oldPriceVal = parseFloat(document.getElementById('m-prod-oldprice').value);
      const stock = parseInt(document.getElementById('m-prod-stock').value, 10);
      const desc = document.getElementById('m-prod-desc').value.trim();

      if (!name || isNaN(price) || isNaN(stock)) return alert("Iltimos, barcha majburiy maydonlarni to'ldiring!");

      let oldPrice = null;
      if (!isNaN(oldPriceVal) && oldPriceVal > price) {
        oldPrice = oldPriceVal;
      }

      const sku = generateProductSKU(adminCatParentId);
      const newProdId = "p" + Date.now();

      const newP = {
        id: newProdId,
        sku,
        name, price, oldPrice, stock, desc: desc || name,
        img: tempBase64Image || "https://via.placeholder.com/150",
        categoryId: adminCatParentId,
        status: stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK',
        isFeatured: true, sortOrder: products.length + 1
      };

      try {
        await apiRequest('products', 'POST', [{
          id: newP.id,
          sku: newP.sku,
          name: newP.name,
          price: newP.price,
          old_price: newP.oldPrice,
          stock: newP.stock,
          description: newP.desc,
          image: newP.img,
          category_id: newP.categoryId,
          status: newP.status,
          is_featured: newP.isFeatured,
          sort_order: newP.sortOrder
        }]);

        products.push(newP);
        localStorage.setItem('products', JSON.stringify(products));
        tempBase64Image = null;
        activePopupModal = null;
        alert(`✅ Yangi tovar (ID: ${sku}) bazaga saqlandi va Barchaga ko'rinadi!`);
        render();

      } catch (e) {
        alert("❌ Bazaga saqlashda xatolik yuz berdi:\n" + e.message);
      }
    }

    async function saveCategoryFromModal() {
      const name = document.getElementById('m-cat-name').value.trim();
      if (!name) return alert("Katalog nomini kiriting!");

      const newCatId = "c" + Date.now();
      const newCatImg = tempBase64Image || (adminCatParentId ? "📦" : "📁");

      try {
        await apiRequest('categories', 'POST', [{
          id: newCatId,
          name: name,
          parent_id: adminCatParentId,
          image: newCatImg
        }]);

        categories.push({ id: newCatId, name, img: newCatImg, parentId: adminCatParentId });
        localStorage.setItem('categories', JSON.stringify(categories));
        tempBase64Image = null;
        activePopupModal = null;
        alert("✅ Katalog bazaga saqlandi!");
        render();

      } catch (e) {
        alert("❌ Bazaga saqlashda xatolik yuz berdi:\n" + e.message);
      }
    }

    async function saveAdminFromModal() {
      const idVal = document.getElementById('m-admin-id').value.trim();
      if (!idVal || isNaN(idVal)) return alert("To'g'ri Telegram ID kiriting!");

      if (!adminsList.includes(idVal)) {
        try {
          await apiRequest('admins', 'POST', [{ telegram_id: idVal }]);
        } catch (e) {}

        adminsList.push(idVal);
        localStorage.setItem('adminsList', JSON.stringify(adminsList));
        alert("✅ Yangi admin biriktirildi!");
      }
      activePopupModal = null;
      render();
    }

    async function saveFieldEdit(prodId, field) {
      const p = products.find(prod => prod.id === prodId);
      if (!p) return;

      let updatePayload = {};

      if (field === 'name') {
        const val = document.getElementById('ef-val').value.trim();
        if (val) { p.name = val; updatePayload.name = val; }
      } else if (field === 'price') {
        const price = parseFloat(document.getElementById('ef-price').value);
        const oldVal = parseFloat(document.getElementById('ef-oldprice').value);
        if (!isNaN(price)) {
          p.price = price;
          p.oldPrice = (!isNaN(oldVal) && oldVal > price) ? oldVal : null;
          updatePayload.price = p.price;
          updatePayload.old_price = p.oldPrice;
        }
      } else if (field === 'stock') {
        const stock = parseInt(document.getElementById('ef-val').value, 10);
        if (!isNaN(stock)) {
          p.stock = stock;
          p.status = stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK';
          updatePayload.stock = p.stock;
          updatePayload.status = p.status;
        }
      } else if (field === 'desc') {
        p.desc = document.getElementById('ef-val').value.trim();
        updatePayload.description = p.desc;
      } else if (field === 'img') {
        if (tempBase64Image) { p.img = tempBase64Image; updatePayload.image = p.img; }
      }

      if (Object.keys(updatePayload).length > 0) {
        try {
          await apiRequest('products', 'PATCH', updatePayload, `?id=eq.${prodId}`);
        } catch (e) {
          alert("❌ Bazaga saqlashda xatolik:\n" + e.message);
          return;
        }
      }

      localStorage.setItem('products', JSON.stringify(products));
      tempBase64Image = null;
      activePopupModal = null;
      selectedProductModal = p;
      render();
    }

    function openAddProductModal() {
      tempBase64Image = null;
      activePopupModal = 'ADD_PROD';
      render();
    }

    function openAddCatModal() {
      tempBase64Image = null;
      activePopupModal = 'ADD_CAT';
      render();
    }

    async function openGranularEditCategoryModal(id, e) {
      if (e) e.stopPropagation();
      const c = categories.find(cat => cat.id === id);
      if (!c) return;

      const name = prompt("Yangi katalog nomi:", c.name);
      if (name) {
        c.name = name;
        localStorage.setItem('categories', JSON.stringify(categories));
        try {
          await apiRequest('categories', 'PATCH', { name }, `?id=eq.${id}`);
        } catch (err) {}
      }
      render();
    }

    async function moveProductSort(id, dir) {
      const idx = products.findIndex(p => p.id === id);
      if (idx < 0) return;
      const targetIdx = idx + dir;
      if (targetIdx < 0 || targetIdx >= products.length) return;

      const temp = products[idx];
      products[idx] = products[targetIdx];
      products[targetIdx] = temp;

      products.forEach((p, i) => p.sortOrder = i + 1);
      localStorage.setItem('products', JSON.stringify(products));
      render();

      try {
        for (let i = 0; i < products.length; i++) {
          await apiRequest('products', 'PATCH', { sort_order: i + 1 }, `?id=eq.${products[i].id}`);
        }
      } catch (e) {}
    }

    async function toggleProductFeatured(id) {
      const p = products.find(prod => prod.id === id);
      if (p) {
        p.isFeatured = !p.isFeatured;
        localStorage.setItem('products', JSON.stringify(products));
        render();

        try {
          await apiRequest('products', 'PATCH', { is_featured: p.isFeatured }, `?id=eq.${id}`);
        } catch (e) {}
      }
    }

    async function deleteProduct(id) {
      if (!confirm("Rostdan ham ushbu mahsulotni o'chirmoqchimisiz?")) return;
      const p = products.find(prod => prod.id === id);
      if (p) {
        p.status = 'DELETED';
        localStorage.setItem('products', JSON.stringify(producshuts));
        render();

        try {
          await apiRequest('products', 'PATCH', { status: 'DELETED' }, `?id=eq.${id}`);
        } catch (e) {}
      }
    }

    async function deleteCategory(id, e) {
      if (e) e.stopPropagation();
      if (!confirm("Katalog o'chirilsinmi?")) return;
      categories = categories.filter(c => c.id !== id);
      localStorage.setItem('categories', JSON.stringify(categories));
      render();

      try {
        await apiRequest('categories', 'DELETE', null, `?id=eq.${id}`);
      } catch (e) {}
    }

    async function saveBulkStock() {
      const input = document.getElementById('bulk-input').value.trim();
      if (!input) return alert("Ma'lumot kiriting!");

      const lines = input.split('\n');
      let count = 0;

      for (const line of lines) {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
          const sku = parts[0].toUpperCase();
          const stock = parseInt(parts[1], 10);
          
          const p = products.find(prod => prod.sku === sku);
          if (p && !isNaN(stock)) {
            p.stock = stock;
            p.status = stock > 0 ? 'ACTIVE' : 'OUT_OF_STOCK';
            count++;

            try {
              await apiRequest('products', 'PATCH', { stock: p.stock, status: p.status }, `?id=eq.${p.id}`);
            } catch (e) {}
          }
        }
      }

      localStorage.setItem('products', JSON.stringify(products));
      alert(`✅ ${count} ta mahsulot qoldig'i bazada yangilandi!`);
      render();
    }

    // INITIAL LAUNCH
    loadDatabaseData();
  </script>
